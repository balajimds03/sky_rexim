<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Password Reset</title>
  </head>
  <body style="font-family: Arial, sans-serif; background-color:#f9f9f9; padding:20px;">
    <div style="max-width:600px; margin:auto; background:#ffffff; padding:20px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1);">
      <h2 style="color:#333;">Password Reset Request</h2>
      <p style="color:#555;">
        Hello,<br><br>
        We received a request to reset your password. Click the button below:
      </p>
      <a href="{{ reset_link }}" 
         style="display:inline-block; padding:12px 24px; margin:20px 0;
                background-color:#007BFF; color:#fff; text-decoration:none;
                border-radius:5px; font-weight:bold;">
         Reset Password
      </a>
      <p style="color:#555;">
        If you did not request this, please ignore the email.<br><br>
        Thanks,<br>
        <strong>Your App Team</strong>
      </p>
    </div>
  </body>
</html>
